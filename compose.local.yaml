services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - ${RAILWAY_LOCALE_SECRETS:?Private environment file required}
    volumes:
      - wefix-prices-data:/app/data
      - type: bind
        source: C:/Users/emanu/apps/data/wefix-prices/incoming
        target: /migration
        read_only: true
    ports:
      - "127.0.0.1:8766:8766"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      apps:
        aliases:
          - rl-wefix-prices-web-1
networks:
  apps:
    external: true
    name: local-apps-network
volumes:
  wefix-prices-data:
